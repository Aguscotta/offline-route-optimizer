spring.application.name=offline-route-optimizer

# Carga el .env desde la raiz del monorepo (o desde backend/ si existiera)
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# Conexion a PostgreSQL usando variables de entorno
spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:route_optimizer}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true